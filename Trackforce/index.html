<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trackforce</title>
<meta name="description" content="Trackforce — your money, tracked on your phone.">
<meta property="og:title" content="Trackforce">
<meta property="og:description" content="Trackforce — your money, tracked on your phone.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F5F2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0C0F" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="app-icon.png">
<link rel="apple-touch-icon" href="app-icon.png">
<style>
  /* Trackforce legal pages — Porcelain (light) and Onyx (dark), the app's own themes. */
  :root {
    color-scheme: light dark;
    --bg: #F5F2EF; --bg2: #FFFFFF; --bg3: #EEE9E5;
    --line: #E6E0DB; --line2: #D3CBC5;
    --ink: #18151B; --ink2: #5F5863; --ink3: #6F6771;
    --rose: #985761; --rose-soft: rgba(154,88,98,.09); --rose-line: rgba(154,88,98,.28);
    --pos: #1A774C; --pos-soft: rgba(29,134,85,.10);
    --neg: #BB3E2C; --neg-soft: rgba(191,63,45,.09);
    --info: #3454B4; --info-soft: rgba(52,84,180,.09);
    --shadow: 0 1px 2px rgba(24,18,22,.04), 0 10px 28px rgba(24,18,22,.07);
    --glow: rgba(154,88,98,.10);
    --hero-from: #221D24; --hero-to: #110F13; --hero-ink: #F6EEE8; --hero-muted: #CDBBB7; --hero-glow: rgba(233,170,150,.24);
    --rg: linear-gradient(135deg, #FCE5D9 0%, #E7AE9C 24%, #B8717B 47%, #F4CDBE 66%, #CC8E89 82%, #94515B 100%);
    --serif: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif", serif;
    --sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0D0C0F; --bg2: #17151A; --bg3: #221F26;
      --line: #2A2630; --line2: #3B3641;
      --ink: #F4EEE9; --ink2: #A79FA9; --ink3: #8C8591;
      --rose: #E9B6A6; --rose-soft: rgba(233,182,166,.13); --rose-line: rgba(233,182,166,.30);
      --pos: #6FD3A0; --pos-soft: rgba(111,211,160,.13);
      --neg: #FF8F80; --neg-soft: rgba(255,143,128,.13);
      --info: #9DB8FF; --info-soft: rgba(157,184,255,.13);
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.35);
      --glow: rgba(233,170,150,.10);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.68 var(--sans); -webkit-font-smoothing: antialiased; overflow-wrap: break-word;
  }
  body::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 520px; z-index: -1; pointer-events: none;
    background: radial-gradient(60% 100% at 50% 0%, var(--glow), transparent 75%);
  }
  svg { flex: none; }
  a { color: var(--rose); text-decoration-line: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: var(--rose-line); }
  a:hover { text-decoration-color: currentColor; }
  :focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; border-radius: 8px; }
  strong { font-weight: 650; }

  .skip { position: absolute; left: 16px; top: -60px; z-index: 10; background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 12px; font-weight: 600; text-decoration: none; }
  .skip:focus { top: 12px; }

  /* Top bar */
  .topbar { max-width: 1080px; margin: 0 auto; padding: 18px 16px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 650; font-size: 17px; letter-spacing: -.01em; }
  .brand img { width: 32px; height: 32px; border-radius: 9px; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .chip-link { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink2); font-size: 14px; text-decoration: none; }
  .chip-link:hover { color: var(--rose); border-color: var(--rose-line); }
  .chip-link svg { width: 16px; height: 16px; }

  /* Document layout */
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 72px; }
  .doc { max-width: 720px; margin: 0 auto; min-width: 0; }
  .toc-side { display: none; }
  @media (min-width: 1024px) {
    .with-toc { display: grid; grid-template-columns: 220px minmax(0, 720px); gap: 56px; justify-content: center; }
    .with-toc .doc { margin: 0; }
    .toc-side { display: block; position: sticky; top: 28px; align-self: start; max-height: calc(100vh - 56px); overflow: auto; padding-top: 52px; }
    .toc-mobile { display: none; }
  }

  .doc-head { padding: 40px 0 6px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--rose); }
  .eyebrow::before { content: ""; width: 18px; height: 1.5px; border-radius: 2px; background: var(--rg); }
  h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(40px, 9vw, 56px); line-height: 1.04; letter-spacing: -.01em; margin: 12px 0 16px; }
  .meta { display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink2); font-size: 13.5px; }
  .meta svg { width: 15px; height: 15px; color: var(--rose); }
  .intro { font-size: 17px; color: var(--ink2); margin: 22px 0 0; }

  /* Table of contents */
  .toc-label, .toc-mobile summary { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); }
  .toc-list { list-style: none; margin: 10px 0 0; padding: 0; }
  .toc-list li { margin: 0; }
  .toc-list a { display: flex; gap: 10px; padding: 7px 10px; border-radius: 10px; color: var(--ink2); text-decoration: none; font-size: 14.5px; line-height: 1.35; }
  .toc-list a:hover { background: var(--bg3); color: var(--ink); }
  .toc-list .n { min-width: 18px; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .toc-mobile { margin: 22px 0 0; padding: 2px 6px; border: 1px solid var(--line); border-radius: 18px; background: var(--bg2); }
  .toc-mobile summary { display: flex; align-items: center; justify-content: space-between; padding: 13px 10px; cursor: pointer; list-style: none; }
  .toc-mobile summary::-webkit-details-marker { display: none; }
  .toc-mobile summary svg { width: 18px; height: 18px; transition: transform .2s; }
  .toc-mobile[open] summary svg { transform: rotate(180deg); }
  .toc-mobile .toc-list { margin: 0 0 8px; }

  /* Sections */
  section { scroll-margin-top: 24px; }
  h2 { display: flex; align-items: flex-start; gap: 12px; font-family: var(--serif); font-weight: 400; font-size: 29px; line-height: 1.15; letter-spacing: -.005em; margin: 48px 0 14px; }
  h2 .num { display: inline-grid; place-items: center; flex: none; min-width: 30px; height: 30px; margin-top: 2px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--rose-line); background: var(--rose-soft); color: var(--rose); font: 600 13px/1 var(--sans); font-variant-numeric: tabular-nums; }
  h3 { display: flex; align-items: center; gap: 10px; font-size: 16.5px; font-weight: 650; line-height: 1.35; margin: 0 0 6px; }
  h3 svg { width: 20px; height: 20px; color: var(--rose); }
  p { margin: 0 0 14px; }
  ul, ol { margin: 0 0 16px; padding-left: 22px; }
  li { margin: 7px 0; }
  li::marker { color: var(--rose); }

  /* Cards */
  .card { margin: 14px 0; padding: 20px; border: 1px solid var(--line); border-radius: 22px; background: var(--bg2); box-shadow: var(--shadow); }
  .card > :last-child { margin-bottom: 0; }
  .note { margin: 16px 0; padding: 18px 18px 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--bg2); }
  .note > :last-child { margin-bottom: 0; }
  .note.warn { border-color: var(--rose-line); background: var(--rose-soft); }

  /* Dark summary card, like the app's hero */
  .hero { position: relative; overflow: hidden; margin: 26px 0 6px; padding: 22px 20px 12px; border-radius: 26px; border: 1px solid rgba(246,238,232,.07); background: linear-gradient(162deg, var(--hero-from), var(--hero-to)); color: var(--hero-ink); box-shadow: var(--shadow); }
  .hero::before { content: ""; position: absolute; right: -100px; top: -140px; width: 320px; height: 320px; background: radial-gradient(circle, var(--hero-glow), transparent 70%); pointer-events: none; }
  .hero::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1.5px; background: var(--rg); opacity: .75; }
  .hero-title { position: relative; display: block; margin: 0 0 6px; font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.2; }
  .checks { position: relative; list-style: none; margin: 0; padding: 0; }
  .checks li { display: grid; grid-template-columns: 22px 1fr; gap: 12px; margin: 0; padding: 11px 0; border-top: 1px solid rgba(246,238,232,.09); }
  .checks li:first-child { border-top: 0; }
  .checks svg { width: 20px; height: 20px; margin-top: 3px; color: #E9B6A6; }

  /* Lists with icons */
  .icon-list { list-style: none; display: grid; gap: 10px; margin: 10px 0 18px; padding: 0; }
  .icon-list li { display: grid; grid-template-columns: 38px 1fr; gap: 14px; align-items: start; margin: 0; padding: 13px 15px; border: 1px solid var(--line); border-radius: 18px; background: var(--bg2); }
  .icon-list li > div { padding-top: 6px; }
  .ico { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--rose-soft); color: var(--rose); }
  .ico svg { width: 20px; height: 20px; }
  .ico.neg { background: var(--neg-soft); color: var(--neg); }
  .ico.info { background: var(--info-soft); color: var(--info); }

  /* Data table — becomes cards on phones */
  .table-card { margin: 14px 0 22px; border: 1px solid var(--line); border-radius: 20px; background: var(--bg2); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; line-height: 1.55; }
  th, td { padding: 13px 15px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  thead th { background: var(--bg3); color: var(--ink2); font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; }
  tbody tr:last-child td { border-bottom: 0; }
  td:first-child { width: 27%; font-weight: 600; }
  td:last-child { width: 25%; color: var(--ink2); }
  @media (max-width: 680px) {
    .table-card { border: 0; border-radius: 0; background: transparent; overflow: visible; }
    thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    table, tbody, tr, td { display: block; width: auto !important; }
    tr { margin: 0 0 10px; padding: 15px 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--bg2); }
    td { padding: 0; border: 0; }
    td:first-child { margin-bottom: 10px; font-size: 16px; }
    td + td { margin-top: 10px; }
    td[data-label]::before { content: attr(data-label); display: block; margin-bottom: 2px; color: var(--ink3); font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; }
  }

  /* Numbered steps */
  .steps { list-style: none; margin: 4px 0 6px; padding: 0; counter-reset: step; }
  .steps li { position: relative; margin: 0; padding: 3px 0 18px 48px; counter-increment: step; }
  .steps li:last-child { padding-bottom: 4px; }
  .steps li::before { content: counter(step); position: absolute; left: 0; top: 0; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--rg); color: #2A171B; font-size: 14px; font-weight: 700; }
  .steps li:not(:last-child)::after { content: ""; position: absolute; left: 15.5px; top: 36px; bottom: 4px; width: 1px; background: var(--line2); }
  .done { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; padding: 11px 14px; border-radius: 14px; background: var(--pos-soft); color: var(--pos); font-weight: 600; }
  .done svg { width: 20px; height: 20px; }

  /* Footer */
  .foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin-top: 60px; padding-top: 22px; border-top: 1px solid var(--line); color: var(--ink2); font-size: 14px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); font-size: 14px; text-decoration: none; }
  .pill:hover { color: var(--rose); border-color: var(--rose-line); }
  .pill svg { width: 16px; height: 16px; color: var(--rose); }
  .to-top { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); text-decoration: none; }
  .to-top:hover { color: var(--rose); }
  .to-top svg { width: 16px; height: 16px; }
  .byline { width: 100%; margin: 6px 0 0; color: var(--ink3); font-size: 13px; }

  /* Home page */
  .home { max-width: 560px; margin: 0 auto; padding: 64px 16px 56px; text-align: center; }
  .home-icon { display: block; width: 92px; height: 92px; margin: 0 auto 22px; border-radius: 24px; box-shadow: 0 14px 36px -8px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.06); }
  .home h1 { margin: 0 0 10px; font-size: clamp(46px, 12vw, 62px); }
  .lede { margin: 0 auto 34px; max-width: 30ch; color: var(--ink2); font-size: 17.5px; line-height: 1.5; }
  .links { display: grid; gap: 12px; text-align: left; }
  .link-card { display: grid; grid-template-columns: 44px 1fr 20px; align-items: center; gap: 14px; padding: 16px 16px 16px 14px; border: 1px solid var(--line); border-radius: 22px; background: var(--bg2); color: var(--ink); text-decoration: none; box-shadow: var(--shadow); }
  .link-card .ico { width: 44px; height: 44px; border-radius: 14px; }
  .link-card .ico svg { width: 22px; height: 22px; }
  .link-card strong { display: block; font-size: 16.5px; }
  .link-card .sub { display: block; margin-top: 1px; color: var(--ink2); font-size: 14px; line-height: 1.4; }
  .link-card .chev { width: 20px; height: 20px; color: var(--ink3); }
  .link-card:hover { border-color: var(--rose-line); }
  .link-card:hover .chev { color: var(--rose); }
  @media (prefers-reduced-motion: no-preference) {
    .link-card { transition: transform .18s ease, border-color .18s ease; }
    .link-card:hover { transform: translateY(-2px); }
  }
  .contact { display: inline-flex; align-items: center; gap: 10px; margin: 30px 0 0; color: var(--ink2); font-size: 15px; }
  .contact svg { width: 18px; height: 18px; color: var(--rose); }

  @media print {
    body::before, .skip, .toc-side, .toc-mobile, .chip-link, .pills, .to-top { display: none !important; }
    body { background: #fff; color: #000; font-size: 11.5pt; }
    .hero { background: none; color: #000; border: 1px solid #bbb; box-shadow: none; }
    .hero::before, .hero::after { display: none; }
    .checks svg { color: #000; }
    .checks li { border-color: #ddd; }
    .card, .note, .icon-list li, .table-card, tr { box-shadow: none; break-inside: avoid; }
    a { color: #000; }
  }

</style>
</head>
<body>
<main class="home">
  <img class="home-icon" src="app-icon.png" width="92" height="92" alt="">
  <h1>Trackforce</h1>
  <p class="lede">Your money, tracked on your phone — by AlphaDays.</p>
